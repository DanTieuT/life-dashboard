[build]
  base = "dashboard-project 10"
  publish = "."
  functions = "netlify/functions"
  # No-op — this is a static HTML/JS app, nothing to build. Explicit so
  # Netlify's framework auto-detection never runs (it scans the resolved
  # repo root for config files and can misfire — e.g. an unrelated
  # config.yaml sitting in ~/Downloads got detected as a Hugo project).
  command = "true"

[dev]
  publish = "."
  port = 8888

[functions."sync-calendar"]
  schedule = "*/5 * * * *"

# 9pm PST Sunday = 05:00 UTC Monday (Netlify cron is UTC, no DST handling)
[functions."weekly-review"]
  schedule = "0 5 * * 1"

# 7am PT daily = 14:00 UTC (Netlify cron is UTC, no DST handling — during PDT
# this fires at 7am PT; during PST it's 6am. Close enough for a briefing.)
[functions."morning-briefing"]
  schedule = "0 14 * * *"

# 6pm PST daily = 02:00 UTC next day (same DST caveat as above). Only actually
# sends a message when tomorrow is an RDO day — see rdo-nudge.js.
[functions."rdo-nudge"]
  schedule = "0 2 * * *"

# Shipping: scan Gmail label for new tracking numbers every 30 min;
# poll 17TRACK for status changes every 2 hours. Both no-op until their
# API keys are configured (GMAIL_* / TRACK17_API_KEY).
[functions."gmail-scan"]
  schedule = "*/30 * * * *"

[functions."shipping-sync"]
  schedule = "0 */2 * * *"

# Reminder delivery — every minute so "remind me at 3:00" lands at 3:00.
[functions."reminder-check"]
  schedule = "* * * * *"

# Plaid bank sync — balances + new transactions 4x/day. No-ops until
# PLAID_CLIENT_ID / PLAID_SECRET are configured and a bank is linked.
[functions."plaid-sync"]
  schedule = "0 */6 * * *"

# Plaid Investments holdings — once daily is plenty (positions/prices don't
# need intraday freshness for a personal dashboard). No-ops until an Item has
# investmentsEnabled:true (see plaid-link.js).
[functions."plaid-investments-sync"]
  schedule = "0 12 * * *"
